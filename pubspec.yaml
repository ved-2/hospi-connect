name: ambulance_app
description: MediRush - Ambulance Emergency Portal for Hospital Resource Management

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.6.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  geolocator: ^14.0.2
  http: ^1.6.0
  firebase_auth: ^6.2.0
  lucide_icons: ^0.257.0              # Premium, balanced, modern icon set
  slide_to_act: ^2.0.2              # "Swipe to accept/arrive" mechanics
  loading_animation_widget: ^1.2.0  # High-end loading indicators
  toastification: ^2.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
